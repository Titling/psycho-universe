# Автотест на каждый PR и пуш: Godot без окна открывает все сцены и проверяет сохранения.
name: Автотест сцен

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Скачать Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 "$RUNNER_TEMP/godot"
          rm godot.zip

      - name: Импорт ресурсов
        run: timeout 600 "$RUNNER_TEMP/godot" --headless --path . --import 2>&1 | tee import.log

      - name: Автотест
        run: |
          set -o pipefail
          timeout 300 "$RUNNER_TEMP/godot" --headless --path . res://tests/smoke_test.tscn 2>&1 | tee smoke.log
          # Ошибка в скрипте не всегда роняет тест, поэтому ищем её в выводе отдельно.
          if grep -q "SCRIPT ERROR" import.log smoke.log; then
            echo "::error::В выводе Godot есть SCRIPT ERROR"
            grep -A2 "SCRIPT ERROR" import.log smoke.log
            exit 1
          fi
